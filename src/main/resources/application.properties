# ========================================
# Aplicación
# ========================================
spring.application.name=Medium Blog Scrapper API
server.port=8080
# ========================================
# Logging
# ========================================
logging.level.com.franilones=DEBUG
logging.pattern.console=%clr([%d{yyyy-MM-dd HH:mm:ss}]){faint} %clr(%-5level){blue} %clr(%logger{35}){cyan} %clr(:){faint} %m%n
# ========================================
# Circuit Breaker (Spring Cloud) + Retry
# ========================================
# Configuración base (default) para todos los circuit breakers
spring.cloud.circuitbreaker.resilience4j.configs.default.slidingWindowSize=10
spring.cloud.circuitbreaker.resilience4j.configs.default.minimumNumberOfCalls=5
spring.cloud.circuitbreaker.resilience4j.configs.default.failureRateThreshold=50
spring.cloud.circuitbreaker.resilience4j.configs.default.waitDurationInOpenState=60s
# Instancia específica para nuestro servicio "mediumService"
spring.cloud.circuitbreaker.resilience4j.circuitbreaker.mediumService.baseConfig=default
# Retry (usa el mismo starter de Spring Cloud, delegando a Resilience4j)
spring.cloud.circuitbreaker.resilience4j.retry.default.maxAttempts=3
spring.cloud.circuitbreaker.resilience4j.retry.default.waitDuration=1s
spring.cloud.circuitbreaker.resilience4j.retry.instances.mediumService.maxAttempts=3
spring.cloud.circuitbreaker.resilience4j.retry.instances.mediumService.waitDuration=1s
# ========================================
# Rate Limiter (Resilience4j puro)
# ========================================P
resilience4j.ratelimiter.instances.mediumService.limitForPeriod=5
resilience4j.ratelimiter.instances.mediumService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.mediumService.timeoutDuration=500ms
